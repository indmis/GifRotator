<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIF Поворот</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a1a1a; color: #eee; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 16px; gap: 16px;
  }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .upload {
    width: 100%; max-width: 500px; border: 2px dashed #444; border-radius: 12px;
    padding: 32px 16px; text-align: center; cursor: pointer; transition: border-color .2s;
  }
  .upload:active { border-color: #4a9eff; }
  .upload input { display: none; }
  .upload span { color: #4a9eff; font-weight: 600; }
  .upload p { margin: 8px 0 0; color: #888; font-size: 13px; }

  .stage { display: none; flex-direction: column; gap: 16px; width: 100%; max-width: 500px; align-items: center; }
  .stage.active { display: flex; }

  .preview-wrap {
    width: 100%; background: #000; border-radius: 12px; overflow: hidden;
    display: flex; justify-content: center; align-items: center; padding: 8px;
  }
  #preview {
    display: block; max-width: 100%; max-height: 60vh;
    width: auto; height: auto;
    object-fit: contain;
    user-select: none; -webkit-user-drag: none;
  }

  .controls { display: flex; flex-direction: column; gap: 12px; width: 100%; }
  .row { display: flex; gap: 8px; align-items: center; }
  button {
    background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 10px;
    padding: 14px 16px; font-size: 16px; font-weight: 600; cursor: pointer;
    transition: background .15s, transform .05s; flex: 1;
  }
  button:active { transform: scale(0.97); background: #333; }
  button.primary { background: #4a9eff; border-color: #4a9eff; color: #fff; }
  button.primary:active { background: #3a8eef; }
  .hint { font-size: 12px; color: #666; text-align: center; }

  #loader {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 100;
    justify-content: center; align-items: center; flex-direction: column; gap: 12px;
  }
  #loader.active { display: flex; }
  .spinner { width: 42px; height: 42px; border: 4px solid #444; border-top-color: #4a9eff; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader span { font-size: 14px; color: #ccc; }

  #result { display: none; flex-direction: column; gap: 12px; width: 100%; max-width: 500px; align-items: center; }
  #result.active { display: flex; }
  #result img { max-width: 100%; border-radius: 12px; background: #000; }
  #result p { font-size: 13px; color: #aaa; text-align: center; margin: 0; }
</style>
</head>
<body>

<h1>GIF Поворот</h1>

<label class="upload" id="uploadBox">
  <input type="file" accept="image/gif" id="fileInput">
  <div>📁 <span>Выберите GIF</span> с устройства</div>
  <p>поворот на 90° • сохранение</p>
</label>

<div class="stage" id="stage">
  <div class="preview-wrap">
    <canvas id="preview"></canvas>
  </div>
  <div class="controls">
    <div class="row">
      <button id="btnRotL">⟲ Влево 90°</button>
      <button id="btnRotR">⟳ Вправо 90°</button>
    </div>
    <div class="row">
      <button id="btnReset">↺ Сброс</button>
    </div>
    <div class="row">
      <button id="btnSave" class="primary">💾 Сохранить GIF</button>
    </div>
    <div class="hint">Каждый тап поворачивает на 90°. Размер canvas подстраивается под повёрнутую гифку.</div>
  </div>
</div>

<div id="result">
  <p>Готово! Если файл не скачался — нажми и удерживай картинку ниже, чтобы сохранить:</p>
  <img id="resultImg" alt="Результат">
</div>

<div id="loader"><div class="spinner"></div><span>Обрабатываю GIF…</span></div>

<!-- gifuct-js как ES-модуль -->
<script type="module">
  import { parseGIF, decompressFrames } from 'https://code4fukui.github.io/gifuct-js/src/index.js';
  window.gifuct = { parseGIF, decompressFrames };
  window.dispatchEvent(new Event('gifuct-ready'));
</script>

<script>
(function() {
  const fileInput = document.getElementById('fileInput');
  const uploadBox = document.getElementById('uploadBox');
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('preview');
  const loader = document.getElementById('loader');

  let gifData = null;
  let rotation = 0;            // 0, 90, 180, 270 — кратность 90
  let outWidth = 0, outHeight = 0;  // размер итогового canvas с учётом поворота
  let currentFrame = 0;
  let animTimer = null;
  let gifJsReady = false;
  let gifWorkerBlobUrl = null;

  function waitForGifuct() {
    return new Promise((resolve) => {
      if (window.gifuct) return resolve();
      window.addEventListener('gifuct-ready', () => resolve(), { once: true });
      setTimeout(() => { if (window.gifuct) resolve(); }, 5000);
    });
  }

  async function initGifJs() {
    if (gifJsReady) return;
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.min.js';
      s.onload = res;
      s.onerror = () => rej(new Error('gif.js load failed'));
      document.head.appendChild(s);
    });
    const resp = await fetch('https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js');
    if (!resp.ok) throw new Error('worker fetch failed');
    const blob = await resp.blob();
    gifWorkerBlobUrl = URL.createObjectURL(blob);
    gifJsReady = true;
  }

  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    loader.classList.add('active');
    try {
      await waitForGifuct();
      if (!window.gifuct) throw new Error('gifuct не загрузился');
      const buf = await file.arrayBuffer();
      gifData = parseGif(buf);
      rotation = 0;
      updateOutputSize();
      uploadBox.style.display = 'none';
      stage.classList.add('active');
      document.getElementById('result').classList.remove('active');
      startPreview();
    } catch (err) {
      alert('Ошибка: ' + err.message);
      console.error(err);
    } finally {
      loader.classList.remove('active');
    }
  });

  function parseGif(buffer) {
    const gif = window.gifuct.parseGIF(buffer);
    const frames = window.gifuct.decompressFrames(gif, true);
    const W = gif.lsd.width, H = gif.lsd.height;
    const offCanvas = document.createElement('canvas');
    offCanvas.width = W; offCanvas.height = H;
    const offCtx = offCanvas.getContext('2d');
    const out = [];
    let prevSnapshot = null;

    for (let i = 0; i < frames.length; i++) {
      const f = frames[i];
      const { width, height, top, left } = f.dims;
      if (f.disposalType === 3) prevSnapshot = offCtx.getImageData(0, 0, W, H);
      const tmp = document.createElement('canvas');
      tmp.width = width; tmp.height = height;
      const tmpCtx = tmp.getContext('2d');
      const imgData = new ImageData(new Uint8ClampedArray(f.patch), width, height);
      tmpCtx.putImageData(imgData, 0, 0);
      offCtx.drawImage(tmp, left, top);
      out.push({ imageData: offCtx.getImageData(0, 0, W, H), delay: (f.delay || 10) });
      if (f.disposalType === 2) offCtx.clearRect(left, top, width, height);
      else if (f.disposalType === 3 && prevSnapshot) offCtx.putImageData(prevSnapshot, 0, 0);
    }
    return { frames: out, width: W, height: H };
  }

  // пересчитать размеры выходного canvas по текущему повороту
  function updateOutputSize() {
    const swap = rotation === 90 || rotation === 270;
    outWidth = swap ? gifData.height : gifData.width;
    outHeight = swap ? gifData.width : gifData.height;
    canvas.width = outWidth;
    canvas.height = outHeight;
    // CSS-размер ограничим, чтобы влезало в экран
    const maxW = Math.min(window.innerWidth - 40, 500);
    const scale = Math.min(maxW / outWidth, 1, (window.innerHeight * 0.6) / outHeight);
    canvas.style.width = (outWidth * scale) + 'px';
    canvas.style.height = (outHeight * scale) + 'px';
  }

  // отрисовать кадр с учётом поворота на итоговый canvas
  function drawFrame(targetCanvas, frame, rot) {
    const swap = rot === 90 || rot === 270;
    const w = swap ? gifData.height : gifData.width;
    const h = swap ? gifData.width : gifData.height;
    targetCanvas.width = w;
    targetCanvas.height = h;
    const c = targetCanvas.getContext('2d');

    // исходный кадр
    const src = document.createElement('canvas');
    src.width = gifData.width;
    src.height = gifData.height;
    src.getContext('2d').putImageData(frame.imageData, 0, 0);

    c.save();
    if (rot === 90) {
      c.translate(w, 0);
      c.rotate(Math.PI / 2);
    } else if (rot === 180) {
      c.translate(w, h);
      c.rotate(Math.PI);
    } else if (rot === 270) {
      c.translate(0, h);
      c.rotate(-Math.PI / 2);
    }
    c.drawImage(src, 0, 0);
    c.restore();
  }

  function startPreview() {
    stopPreview();
    currentFrame = 0;
    const tick = () => {
      if (!gifData) return;
      drawFrame(canvas, gifData.frames[currentFrame], rotation);
      const delay = gifData.frames[currentFrame].delay || 100;
      animTimer = setTimeout(() => {
        currentFrame = (currentFrame + 1) % gifData.frames.length;
        tick();
      }, delay);
    };
    tick();
  }
  function stopPreview() { if (animTimer) clearTimeout(animTimer); animTimer = null; }

  function setRotation(newRot) {
    rotation = ((newRot % 360) + 360) % 360;
    updateOutputSize();
  }

  document.getElementById('btnRotL').onclick = () => setRotation(rotation - 90);
  document.getElementById('btnRotR').onclick = () => setRotation(rotation + 90);
  document.getElementById('btnReset').onclick = () => setRotation(0);

  document.getElementById('btnSave').onclick = async () => {
    if (!gifData) return;
    stopPreview();
    loader.classList.add('active');
    await new Promise(r => setTimeout(r, 30));
    try {
      await initGifJs();
      const blob = await renderGif();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'rotated.gif';
      document.body.appendChild(a); a.click(); a.remove();
      const resBox = document.getElementById('result');
      document.getElementById('resultImg').src = url;
      resBox.classList.add('active');
      resBox.scrollIntoView({ behavior: 'smooth' });
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (err) {
      alert('Ошибка при сохранении: ' + err.message);
      console.error(err);
    } finally {
      loader.classList.remove('active');
      startPreview();
    }
  };

  function renderGif() {
    return new Promise((resolve, reject) => {
      const swap = rotation === 90 || rotation === 270;
      const W = swap ? gifData.height : gifData.width;
      const H = swap ? gifData.width : gifData.height;
      const encoder = new GIF({
        workers: 2, quality: 10, width: W, height: H,
        workerScript: gifWorkerBlobUrl
      });
      const frameCanvas = document.createElement('canvas');
      for (let i = 0; i < gifData.frames.length; i++) {
        drawFrame(frameCanvas, gifData.frames[i], rotation);
        encoder.addFrame(frameCanvas, { delay: gifData.frames[i].delay || 100, copy: true });
      }
      encoder.on('finished', (blob) => resolve(blob));
      encoder.on('error', (e) => reject(e));
      encoder.render();
    });
  }

  // при изменении размера окна — пересчитать CSS-масштаб
  window.addEventListener('resize', () => { if (gifData) updateOutputSize(); });

})();
</script>
</body>
</html>
